name: DataForge V2 CI

on:
  push:
    paths: ["dataforge/**"]
  pull_request:
    paths: ["dataforge/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests
        run: python -m pytest tests/integration -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataforge/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dataforge/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

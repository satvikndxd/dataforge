apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: { app: dataforge-api }
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: { app: dataforge-api }
  template:
    metadata:
      labels: { app: dataforge-api }
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api }}
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-env }
            - secretRef: { name: {{ .Release.Name }}-secrets }
          readinessProbe:
            httpGet: { path: /v1/admin/health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /v1/admin/health, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: dataforge-api }
  ports: [{ port: 8000, targetPort: 8000 }]
